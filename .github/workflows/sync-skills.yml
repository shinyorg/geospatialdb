name: Sync Skills to Skills Repository

on:
  push:
    branches:
      - main
    paths:
      - 'SKILLS/**'
  workflow_dispatch:

jobs:
  sync-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout skills repository
        uses: actions/checkout@v4
        with:
          repository: shinyorg/skills
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-repo

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync skills directory
        run: |
          # Copy skills content only (not plugin manifests)
          # The target repo organizes skills under plugins/<plugin>/skills/<skill>
          if [ -d "source/SKILLS/shiny-spatial" ]; then
            # Remove existing skill directory to ensure clean sync
            rm -rf skills-repo/plugins/shiny-data/skills/shiny-spatial
            mkdir -p skills-repo/plugins/shiny-data/skills
            cp -r source/SKILLS/shiny-spatial skills-repo/plugins/shiny-data/skills/
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-repo
          commit-message: "Update shiny-spatial skill from geospatialdb repository"
          title: "Update shiny-spatial skill"
          body: |
            This PR updates the shiny-spatial skill from the [geospatialdb repository](https://github.com/shinyorg/geospatialdb).

            **Source commit:** ${{ github.sha }}
            **Triggered by:** @${{ github.actor }}

            ---
            *This PR was automatically created by the [sync-skills workflow](https://github.com/shinyorg/geospatialdb/actions/workflows/sync-skills.yml).*
          branch: update-shiny-spatial-skill
          delete-branch: true
          labels: |
            automated
            skills-update
